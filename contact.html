    <title>Contant Sheet</title>

<body>
    <header>
        <h1>Contact Sheet</h1>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="resume.html">Resume</a>
        <a href="photos.html">Photos</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main>
        <div class="contact-container">
            <form id="registrationForm">
                <h3 class="top">Contact Me!</h3>
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>

                <label for="phonenumber">Phone Number</label>
                <input type="phone" id="phonenumber" name="phonenumber" placeholder="Enter your phone number" required>

                <label for="emailaddress">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your phone number" required>

                <label for="comments">Comments</label>
                <input type="text" id="comments" name="comments" placeholder="Enter any comments you may have">

                <button type="submit">Submit</button>
        </div>
    </main>
